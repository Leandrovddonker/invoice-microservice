name: s1146357_invoices

services:
  invoice-service:
    # Production only pulls the image that GitLab CI already built and pushed.
    image: ${DOCKER_IMAGE}:latest
    ports:
      - "${DEPLOY_PORT:-8088}:8088"
    container_name: ${DEPLOY_CONTAINER_NAME:-kotlin-invoice-service}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
        - invoice-network
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8088}
      SERVICES_USER_BASE_URL: ${SERVICES_USER_BASE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://eureka-server:8761/eureka/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      TAX_RATES_LABOR: ${TAX_RATES_LABOR:-0.19}
      TAX_RATES_PART: ${TAX_RATES_PART:-0.21}
      TAX_RATES_SALE: ${TAX_RATES_SALE:-0.21}
networks:
  invoice-network:
    driver: bridge

