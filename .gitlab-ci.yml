workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - build
  - test
  - package
  - deploy-prod

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  DEPLOY_HOST: "student.inf.st.hsleiden.nl"
  APP_PORT: "8088"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

.default-branch-rules: &default_branch_rules
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - chmod +x ./gradlew

# Compile sources early so obvious Kotlin/Spring wiring issues fail fast.
build:
  stage: build
  script:
    - ./gradlew --build-cache clean classes
  <<: *default_branch_rules

# Run the full automated test suite on the same branch set.
test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test
      - build/test-results/test
  <<: *default_branch_rules

# Build the production jar, bake it into a Docker image and push that image to GitLab.
package:
  stage: package
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache openjdk21-jdk bash
    - chmod +x ./gradlew
    - |
      for var in CI_REGISTRY CI_REGISTRY_USER CI_REGISTRY_PASSWORD CI_REGISTRY_IMAGE CI_COMMIT_SHORT_SHA CI_COMMIT_BRANCH; do
        eval "value=\${$var}"
        if [ -z "$value" ]; then
          echo "Missing required variable: $var"
          exit 1
        fi
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - ./gradlew --build-cache bootJar
    - docker build --pull -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" "$DOCKER_IMAGE:latest"
        docker push "$DOCKER_IMAGE:latest"
      fi
  <<: *default_branch_rules

# Deploy main to the school server by pulling the prebuilt registry image.
deploy-prod:
  stage: deploy-prod
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - |
      for var in SSH_PRIVATE_KEY DEPLOY_USER DEPLOY_DIR_PROD CI_REGISTRY CI_REGISTRY_USER CI_REGISTRY_PASSWORD CI_REGISTRY_IMAGE SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD SPRING_RABBITMQ_HOST SPRING_RABBITMQ_PORT SPRING_RABBITMQ_USERNAME SPRING_RABBITMQ_PASSWORD SERVICES_USER_BASE_URL EUREKA_CLIENT_ENABLED EUREKA_DEFAULT_ZONE TAX_RATES_LABOR TAX_RATES_PART TAX_RATES_SALE; do
        eval "value=\${$var}"
        if [ -z "$value" ]; then
          echo "Missing required variable: $var"
          exit 1
        fi
      done
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H student.inf.st.hsleiden.nl >> ~/.ssh/known_hosts
  script:
    - |
      {
        printf 'DOCKER_IMAGE=%s\n' "$DOCKER_IMAGE"
        printf 'DEPLOY_PORT=%s\n' "${DEPLOY_PORT:-$APP_PORT}"
        printf 'SPRING_PROFILES_ACTIVE=%s\n' 'docker'
        printf 'SERVER_PORT=%s\n' "$APP_PORT"
        printf 'SERVICES_USER_BASE_URL=%s\n' "$SERVICES_USER_BASE_URL"
        printf 'EUREKA_CLIENT_ENABLED=%s\n' "$EUREKA_CLIENT_ENABLED"
        printf 'EUREKA_DEFAULT_ZONE=%s\n' "$EUREKA_DEFAULT_ZONE"
        printf 'SPRING_DATASOURCE_URL=%s\n' "$SPRING_DATASOURCE_URL"
        printf 'SPRING_DATASOURCE_USERNAME=%s\n' "$SPRING_DATASOURCE_USERNAME"
        printf 'SPRING_DATASOURCE_PASSWORD=%s\n' "$SPRING_DATASOURCE_PASSWORD"
        printf 'SPRING_RABBITMQ_HOST=%s\n' "$SPRING_RABBITMQ_HOST"
        printf 'SPRING_RABBITMQ_PORT=%s\n' "$SPRING_RABBITMQ_PORT"
        printf 'SPRING_RABBITMQ_USERNAME=%s\n' "$SPRING_RABBITMQ_USERNAME"
        printf 'SPRING_RABBITMQ_PASSWORD=%s\n' "$SPRING_RABBITMQ_PASSWORD"
        printf 'TAX_RATES_LABOR=%s\n' "$TAX_RATES_LABOR"
        printf 'TAX_RATES_PART=%s\n' "$TAX_RATES_PART"
        printf 'TAX_RATES_SALE=%s\n' "$TAX_RATES_SALE"
      } > deploy.env
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR_PROD'"
    - scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR_PROD/docker-compose.yml"
    - scp deploy.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR_PROD/.env"
    - printf '%s\n' "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login '$CI_REGISTRY' -u '$CI_REGISTRY_USER' --password-stdin"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        bash -lc '
          set -e
          cd \"$DEPLOY_DIR_PROD\"
          docker compose -p s1146357_invoice_prod pull
          docker compose -p s1146357_invoice_prod down || true
          docker compose -p s1146357_invoice_prod up -d
          sleep 10
          docker compose -p s1146357_invoice_prod ps
          docker compose -p s1146357_invoice_prod logs --tail=50
        '
      "
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
