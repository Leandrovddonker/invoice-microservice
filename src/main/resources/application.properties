spring.application.name=invoice-service
server.port=${SERVER_PORT:8088}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka/}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

services.user.base-url=${SERVICES_USER_BASE_URL:http://localhost:8083}

tax.rates.labor=${TAX_RATES_LABOR:0.19}
tax.rates.part=${TAX_RATES_PART:0.21}
