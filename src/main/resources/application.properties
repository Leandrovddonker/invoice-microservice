spring.application.name=invoice-service
server.port=${SERVER_PORT:8091}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.non-secure-port=${SERVER_PORT:8091}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${eureka.instance.non-secure-port}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

services.user.base-url=${SERVICES_USER_BASE_URL:http://localhost:8081}

tax.rates.labor=${TAX_RATES_LABOR:0.19}
tax.rates.part=${TAX_RATES_PART:0.21}
tax.rates.sale=${TAX_RATES_SALE:0.21}
