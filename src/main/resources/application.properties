spring.application.name=invoice-service
server.port=${SERVER_PORT:8091}
management.endpoints.web.exposure.include=health,info

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.non-secure-port=${server.port}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${eureka.instance.non-secure-port}
eureka.instance.appname=${spring.application.name}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.virtual-host-name=${spring.application.name}
eureka.instance.secure-virtual-host-name=${spring.application.name}
eureka.instance.status-page-url=http://${eureka.instance.hostname}:${eureka.instance.non-secure-port}/actuator/info
eureka.instance.health-check-url=http://${eureka.instance.hostname}:${eureka.instance.non-secure-port}/actuator/health

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

services.user.base-url=${SERVICES_USER_BASE_URL:http://localhost:8081}

tax.rates.labor=${TAX_RATES_LABOR:0.19}
tax.rates.part=${TAX_RATES_PART:0.21}
tax.rates.sale=${TAX_RATES_SALE:0.21}
