server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/InvoiceDB
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

services:
  user:
    base-url: http://localhost:8081

tax:
  rates:
    labor: 0.19
    part: 0.21
    sale: 0.21
